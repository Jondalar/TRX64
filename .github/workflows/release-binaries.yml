# Platform binaries, built on GitHub-hosted runners.
#
# WHY HERE AND NOT ON THE NAS: containers are built on the self-hosted runner, where the
# NAS is native amd64 and the image lands where it runs. Binaries are different — macOS
# needs a Mac and Windows needs MSVC, and cross-compiling is not a way out for this
# workspace: reSID and a bundled DuckDB are compiled by a real C++ toolchain via build.rs,
# so every target needs that target's compiler. GitHub has the hardware; running a Mac as
# a build slave is the thing this avoids.
#
# The two pipelines answer different questions, which is why living in different places is
# not confusing: the NAS is the GATE (every push, fast, is the image sane), this is the
# RELEASE (rare, deliberate, all platforms).
#
# STAGED, one platform per step so a failure names one cause. macOS proved itself first
# (green, 16 min, links only /usr/lib, and the produced daemon boots a real machine).
# Windows is green as of 2026-08-10 — it needed a shim for reSID's gcc-only branch hints
# (see crates/trx64-core/resid_msvc_prelude.h), and the bundled DuckDB turned out to
# compile under MSVC untouched. Linux joins once Windows is confirmed on real hardware.
#
# SHELL: `bash` everywhere, including Windows (git-bash ships on the runner). One set of
# scripts beats maintaining a PowerShell twin of each step.

name: release-binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the artifact (defaults to the workspace version)'
        required: false
  # Nightly, 03:00 CEST (cron is UTC). Nightly and not per-push because a cold build is
  # 16-40 minutes per platform and most pushes here cannot change a binary's behaviour
  # enough to be worth that. The `commits` job below turns the night into a no-op when
  # nothing landed, so a quiet week costs nothing at all.
  #
  # A pleasant side effect: a nightly that DOES build keeps the cargo cache warm, and
  # GitHub only evicts entries after 7 days without a hit. So the slow cold build is what
  # you get after a genuinely quiet stretch — which is exactly when nobody is waiting.
  #
  # NOTE GitHub disables scheduled workflows in a public repo after 60 days without any
  # activity, and re-enabling is a button in the Actions tab.
  schedule:
    - cron: '0 1 * * *'

defaults:
  run:
    shell: bash

jobs:
  # Did anything land since yesterday? A scheduled run with no new commit would rebuild
  # the identical tree, so it is skipped. Manual runs always build — asking for one IS the
  # reason. Depth-1 is enough: the question is only whether HEAD itself is recent.
  commits:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "manual run — building"
            exit 0
          fi
          LAST=$(git log -1 --format=%cI)
          if [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "new commit since yesterday ($LAST) — building"
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "nothing landed since yesterday (HEAD is $LAST) — skipping"
          fi

  build:
    needs: commits
    if: needs.commits.outputs.build == 'true'
    strategy:
      # Keep going if one platform breaks — a Windows failure should not hide a good macOS
      # build, especially while platforms are still being added one at a time.
      fail-fast: false
      matrix:
        include:
          # macOS: no extra system dependencies. The CLI pulls in winit + cpal, whose
          # macOS backends (AppKit / CoreAudio) are part of the OS, and the Xcode command
          # line tools supply the C++ compiler reSID needs.
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
          # Windows: MSVC toolchain, preinstalled. winit/cpal use Win32/WASAPI, also part
          # of the OS. `.zip` because that is what a Windows user expects to receive.
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      # Caches ~/.cargo (registry + git checkouts) and target/, keyed on Cargo.lock, the
      # rustc version and the job. The prize is libduckdb-sys: a C++ amalgamation that ate
      # ~31 of the 36 minutes when this was measured natively, and that does not change
      # when our Rust does. It is a registry dependency, so it survives the action's
      # pruning — our own crates' artifacts do not, which is fine (reSID is seconds).
      #
      # KNOW WHAT THIS DOES AND DOES NOT BUY: GitHub evicts cache entries after 7 days
      # without a hit, so a release built once a month always starts cold. This pays off
      # while iterating — a red platform, a fix, a rerun — which is exactly the phase this
      # workflow is in while platforms are being added one at a time.
      #
      # cache-on-failure because the useful case is a build that dies LATE: the deps are
      # already compiled and worth keeping even though the job goes red.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Read the product version
        id: ver
        run: |
          set -eu
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "building $V for ${{ matrix.target }}"

      - name: Build
        # `strip` via cargo rather than the platform's strip tool: one mechanism for every
        # target, and it does not touch the local release profile developers debug with.
        # The first macOS artifact shipped 8.5 MB of symbols (94k of them) nobody running
        # the binary needs.
        #
        # A cold build is long: 433 crates, one of which (bundled DuckDB) is a C++
        # amalgamation that alone took ~31 of 36 minutes natively on the NAS. Measured
        # cold here: macOS ~16 min, Windows ~40 min. The cache step above cuts the repeat.
        run: |
          cargo build --release --config 'profile.release.strip="symbols"' \
            -p trx64-cli -p trx64-daemon

      - name: Prove the binaries are what they claim
        run: |
          set -eu
          V="${{ steps.ver.outputs.version }}"
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          for b in trx64cli trx64-daemon; do
            GOT=$(./target/release/$b$EXT --version | awk '{print $2}')
            echo "$b reports $GOT (expected $V)"
            [ "$GOT" = "$V" ] || { echo "::error::$b reports $GOT but the build says $V"; exit 1; }
          done

      - name: What does it link against
        # A binary that cannot resolve its dynamic libraries is useless to whoever
        # downloads it, and an accidental dependency on something only the runner has is
        # invisible until then. macOS answered "/usr/lib only", which is what we want.
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L ./target/release/trx64cli | head -20
          else
            dumpbin //DEPENDENTS ./target/release/trx64cli.exe 2>/dev/null | head -25 \
              || echo "(dumpbin unavailable outside the VS env — skipped, not a failure)"
          fi

      - name: Package
        run: |
          set -eu
          V="${{ steps.ver.outputs.version }}"
          NAME="trx64-$V-${{ matrix.target }}"
          mkdir -p dist
          # NOTE the ROMs are NOT bundled — they are Commodore's property. The daemon
          # resolves them from C64RE_ROOT/resources/roms; the container mounts them as a
          # volume for the same reason.
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp target/release/trx64cli.exe target/release/trx64-daemon.exe dist/
            (cd dist && 7z a "$NAME.zip" trx64cli.exe trx64-daemon.exe >/dev/null)
            (cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          else
            cp target/release/trx64cli target/release/trx64-daemon dist/
            (cd dist && tar czf "$NAME.tar.gz" trx64cli trx64-daemon)
            (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: trx64-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          # Nightlies are a health check, not an archive — a real release is cut
          # deliberately. Two weeks is long enough to grab yesterday's build and short
          # enough that the tab does not fill with 90 days of identical zips.
          retention-days: 14
