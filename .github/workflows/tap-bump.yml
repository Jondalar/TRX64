# Keep the Homebrew tap pointing at the newest release, without anyone copying two
# checksums by hand.
#
# Fires when release-binaries COMPLETES (`workflow_run`), and does anything only if that
# run succeeded. Its `publish` job has by then created and published the release with all
# six archives and six .sha256 files, so there is nothing to wait for and no polling. (The
# old `release: published` trigger is gone: a release made by a workflow with GITHUB_TOKEN
# does not fire events for other workflows, and one made by hand raced its own uploads.)
#
# WHICH TAG: `workflow_run` does not expose the triggering run's inputs. `publish` therefore
# uploads an artifact `release-tag` (tag.txt), and this job downloads it from the triggering
# run with `gh run download` (run id + GITHUB_TOKEN, `actions: read`). That is exact: it is
# the tag that run published, not a guess from head_sha or "latest release", which would be
# wrong after a re-run or a later release. Runs with no such artifact (the nightly build,
# or a dispatch without `version`) published nothing, so the job ends there with a notice.
#
# workflow_run only fires for workflow files on the DEFAULT branch, and uses the default
# branch's copy of THIS file. Manual fallback: `workflow_dispatch` with a tag.
#
# It commits straight to the tap's main branch rather than opening a PR: a PR that nobody
# merges leaves `brew install` handing out the previous version, which is a worse failure
# than an unreviewed formula line. Everything it writes is derived from the release assets,
# and a bad bump is one revert away. To gate it instead, push to a branch here and open a
# PR — the rewrite step stays as it is.
#
# PREREQUISITE, and it is not optional: a repository secret TAP_TOKEN. A workflow's built-in
# GITHUB_TOKEN is scoped to its OWN repository, so it cannot push to the tap. Create a
# fine-grained PAT with `Contents: Read and write` on Jondalar/homebrew-trx64 only, then:
#
#   gh secret set TAP_TOKEN -R Jondalar/TRX64
#
# The job fails loudly when it is missing rather than silently skipping — a tap that quietly
# stopped updating is exactly the thing this workflow exists to prevent.

name: tap-bump

on:
  workflow_run:
    workflows: [release-binaries]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to the tap (e.g. v0.3.0)'
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # A manual dispatch always runs; a triggered run only after a green release-binaries.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Which release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            rm -rf reltag && mkdir reltag
            if ! gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n release-tag -D reltag 2>/dev/null; then
              echo "::notice::run $RUN_ID published no release (no release-tag artifact) — tap untouched"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            TAG=$(tr -d '[:space:]' < reltag/tag.txt)
          fi
          [ -n "$TAG" ] || { echo "::error::no tag"; exit 1; }
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "publishing $TAG to the tap"

      - name: Require the tap token
        if: steps.rel.outputs.skip != 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -eu
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::TAP_TOKEN is not set — see the header of this workflow. The tap was NOT updated."
            exit 1
          fi

      - name: Fetch the release checksums
        if: steps.rel.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -eu
          # The release is complete by now (release-binaries publishes it only after all
          # assets are uploaded), so this is a guard, not a wait: fail if anything is missing.
          rm -rf sums && mkdir sums
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.sha256' -D sums
          for t in macos-arm64 macos-x86_64 linux-x86_64 linux-arm64; do
            ls sums/trx64-*-$t.tar.gz.sha256 >/dev/null 2>&1 \
              || { echo "::error::release $TAG lacks the $t checksum"; exit 1; }
          done
          echo "got all four checksums"

      - name: Check out the tap
        if: steps.rel.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: Jondalar/homebrew-trx64
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Rewrite the formula
        if: steps.rel.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -eu
          python3 - <<'PY'
          import os, re, glob, pathlib

          version = os.environ["VERSION"]
          # target name -> sha, read from the release's own .sha256 files. Deriving both from
          # the release means the formula can never disagree with what is published.
          shas = {}
          for f in glob.glob("sums/*.sha256"):
              digest, name = open(f).read().split()[:2]
              for target in ("macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"):
                  if target in name:
                      shas[target] = (digest, name)

          path = pathlib.Path("tap/Formula/trx64.rb")
          src = path.read_text()
          out, current, changed = [], None, 0

          for line in src.splitlines(keepends=True):
              if re.match(r'\s*version "', line):
                  line = re.sub(r'"[^"]*"', f'"{version}"', line, count=1); changed += 1
              elif '/releases/download/' in line:
                  # The URL is fully determined by version + target, so rebuild it rather
                  # than patching pieces of the old one.
                  for target, (_, name) in shas.items():
                      if target in line:
                          current = target
                          line = re.sub(
                              r'https://\S+"',
                              f'https://github.com/Jondalar/TRX64/releases/download/'
                              f'v{version}/{name}"', line, count=1)
                          changed += 1
              elif re.match(r'\s*sha256 "', line) and current:
                  line = re.sub(r'"[0-9a-f]{64}"', f'"{shas[current][0]}"', line, count=1)
                  changed += 1
                  current = None
              out.append(line)

          if changed < 9:   # version + 4 urls + 4 shas
              raise SystemExit(f"only {changed} lines rewritten — formula shape changed?")
          path.write_text("".join(out))
          print("".join(l for l in out if 'version "' in l or 'download/' in l or 'sha256 "' in l))
          PY
          ruby -c tap/Formula/trx64.rb

      - name: Commit to the tap
        if: steps.rel.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -eu
          cd tap
          if git diff --quiet; then
            echo "formula already at $VERSION — nothing to do"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/trx64.rb
          git commit -m "trx64 $VERSION

          Version, URLs and every checksum taken from the release assets of
          Jondalar/TRX64 v$VERSION by the tap-bump workflow."
          git push
          echo "tap updated to $VERSION"
