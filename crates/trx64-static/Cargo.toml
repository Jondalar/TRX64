# trx64-static — the machine-free 6502 decoder the runtime uses.
# Capability-cut step 1 (docs/capability-cut-decisions.md): one decoder shared by
# trx64-daemon (monitor verbs) and trx64-cli (`trx64cli disasm`). Static analysis
# is C64RE's (revised 2026-09-19); nothing else moves here.

[package]
name = "trx64-static"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "TRX64 static capability: machine-free 6502 decode (later: media parse, classifiers)."

[dependencies]
trx64-core = { path = "../trx64-core" }

[dev-dependencies]
# Golden-parity tests read the TS-oracle-generated JSON (tests/goldens/).
serde_json = "1"
