[workspace]
resolver = "2"
members = [
    "crates/trx64-core",
    "crates/trx64-static",
    "crates/trx64-trace",
    "crates/trx64-session",
    "crates/trx64-daemon",
    "crates/trx64-ffi",
    "crates/trx64-cli",
]

[workspace.package]
edition = "2021"
# ONE product version for the whole workspace — every crate inherits it
# (`version.workspace = true`). The crates are never consumed separately (no
# crates.io release, all built + shipped together), so per-crate semver would be
# pure bookkeeping. This number answers "which build is running": it is reported
# by `--version` on both binaries, in the daemon's start log, in the `ping`
# handshake, and as the container's image tag/label.
#
# It is INDEPENDENT of the boundary contracts, which change at a different rate
# and keep their own counters:
#   - the WS wire protocol epoch (`RUNTIME_VERSION` = "trx64-runtime/N", daemon
#     main.rs) — bump ONLY on a wire-breaking change, in lockstep with C64RE's
#     EXPECTED_RUNTIME_PROTOCOL;
#   - the `.c64re` snapshot `schemaVersion`.
# Bump this one freely: 0.x → minor for features, patch for fixes.
version = "0.2.0"
license = "GPL-3.0-or-later"

# TRX64 — Rust drop-in for the C64ReverseEngineeringMCP headless runtime.
# Phase 1: behavior-identical replacement of the Node daemon behind ws://127.0.0.1:4312,
# verified by trace-diff against the TS runtime as golden oracle.
