# The two play sidecars, as a definition instead of two hand-typed `docker run` lines.
#
# One container = one live C64 (CLAUDE.md "One Machine Per Process"), so each project gets
# its own: separate machine, separate memory, separate mounted media. They share only the
# image and the ROM volume — never a machine.
#
#   docker compose -f compose.sidecars.yml up -d
#
# PREREQUISITES (both one-off, and deliberately NOT automated here):
#
#   1. The ROM volume, seeded from the private ROM image:
#        docker volume create wl-roms
#        docker run --rm -v wl-roms:/dest <registry>/alex/wl-roms:1
#      The ROMs are Commodore's property. They live in a PRIVATE registry and are mounted
#      read-only; the runtime image itself carries none, which is what allows it to be
#      published at all.
#
#   2. The external network. These are macvlan-style static addresses on the LAN, so the
#      editors reach them by a fixed IP that must not move — hence `external: true` rather
#      than a compose-managed network.
#
# Addresses, host paths and the network name come from a gitignored `.env` (see
# `.env.example`) — this file is public, a deployment's addressing is not.
#
# One hard-won rule for whoever fills that .env in: pick the address by scanning what
# actually ANSWERS on the LAN, not by continuing the pattern. Doing the latter here landed
# a runtime on an address a VM already held — and VMs do not appear in `docker ps`. The
# failure is nasty: the address pings (the VM answers) while the port is refused, and from
# inside the bridge the container resolves its own address locally, so it looks healthy
# from one side and broken from the other.

services:
  wl-trx64:
    image: wl-trx64:0.3.0
    container_name: wl-trx64
    restart: unless-stopped
    environment:
      TRX64_BIND: 0.0.0.0   # reachable from the sibling editor container, not just from inside
    volumes:
      - ${HOST_DATA:?set HOST_DATA in .env}/wl-play:/play:ro          # the built cart; ro so a flash write-back cannot touch it
      - ${HOST_DATA}/wl-dumps:/dumps           # snapshot/dump target — daemon writes here
      - wl-roms:/opt/trx64/resources/roms:ro
    networks:
      lan:
        ipv4_address: ${WL_TRX64_IP:?set WL_TRX64_IP in .env}

  wl2-trx64:
    image: wl-trx64:0.3.0
    container_name: wl2-trx64
    restart: unless-stopped
    environment:
      TRX64_BIND: 0.0.0.0
    volumes:
      - ${HOST_DATA}/wl2-play:/play:ro
      - ${HOST_DATA}/wl2-dumps:/dumps
      - wl-roms:/opt/trx64/resources/roms:ro
    networks:
      lan:
        ipv4_address: ${WL2_TRX64_IP:?set WL2_TRX64_IP in .env}

volumes:
  wl-roms:
    external: true

networks:
  lan:
    external: true
    name: ${LAN_NETWORK:?set LAN_NETWORK in .env}
