# Build the wl-trx64 container image on the NAS runner.
#
# WHY THIS EXISTS: the image used to be built by hand on a Mac — an arm64 host emulating
# amd64, then an OCI export, a skopeo conversion, a 92 MB scp and a `docker load`. That
# chain was run twice in one day and is exactly the kind of thing that deploys the wrong
# artifact eventually. The NAS is native x86_64 with 39 GB of RAM, so it builds the image
# where the image actually runs, and nothing has to be transferred at all.
#
# WHY IT NEEDS NO ROMS: the image is ROM-less (Spec 801 §A). Commodore's ROMs are not ours
# to distribute, so they are mounted at runtime instead of baked in — which also means a
# CI job needs nothing but the source. That is why this workflow is so short.
#
# WHY NO `actions/checkout`: it is a JavaScript action, so it needs `node` inside the job
# container, and the container here is `docker:cli` (alpine, no node). Rather than drag a
# node runtime in just to copy files, the source is cloned with git — three lines, no JS
# runtime, and one less thing that has to be fetched from the internet on a LAN-only box.

name: build-image

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docker/Dockerfile'
      - '.gitea/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (defaults to the workspace version)'
        required: false

jobs:
  image:
    runs-on: dockerbuild
    # The job container is `docker:cli` — alpine, so `sh`, not `bash`. Actions defaults to
    # bash, which simply is not there. Set once here rather than on every step.
    defaults:
      run:
        shell: sh
    steps:
      - name: Fetch the source
        # GITHUB_SERVER_URL is supplied by the runner, so the instance address stays out of
        # the repository — and the workflow keeps working if the server ever moves.
        run: |
          set -eu
          apk add --no-cache git >/dev/null
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" src
          cd src && git log --oneline -1

      - name: Read the product version
        id: ver
        run: |
          set -eu
          # One version for the whole workspace (Spec 800 §E). The image tag must equal it,
          # so a running container can be identified by `ping` alone.
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(grep -m1 '^version = ' src/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "building wl-trx64:$V"

      - name: Build
        run: |
          set -eu
          cd src
          docker build \
            -f docker/Dockerfile \
            --build-arg TRX64_VERSION=${{ steps.ver.outputs.version }} \
            -t wl-trx64:${{ steps.ver.outputs.version }} \
            -t wl-trx64:latest \
            .

      - name: Prove the tag matches what is inside it
        run: |
          set -eu
          docker images wl-trx64 --format '{{.Repository}}:{{.Tag}}  {{.Size}}  {{.CreatedSince}}'
          # A tag that disagrees with the build is the drift this pipeline exists to
          # prevent — it happened once already, when a hand-built "0.1.0" carried features
          # that 0.1.0 did not. Fail here rather than on the NAS three days later.
          GOT=$(docker run --rm --entrypoint /usr/local/bin/trx64-daemon \
                  wl-trx64:${{ steps.ver.outputs.version }} --version | awk '{print $2}')
          echo "binary reports: $GOT / tag says: ${{ steps.ver.outputs.version }}"
          [ "$GOT" = "${{ steps.ver.outputs.version }}" ] || {
            echo "::error::version mismatch — the image does not contain what its tag claims"
            exit 1
          }
