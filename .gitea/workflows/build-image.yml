# Build the wl-trx64 container image on the NAS runner.
#
# WHY THIS EXISTS: the image used to be built by hand on a Mac — an arm64 host emulating
# amd64, then an OCI export, a skopeo conversion, a 92 MB scp and a `docker load`. That
# chain was run twice in one day and is exactly the kind of thing that deploys the wrong
# artifact eventually. The NAS is native x86_64 with 39 GB of RAM, so it builds the image
# where the image actually runs, and nothing has to be transferred at all.
#
# WHY IT NEEDS NO ROMS: the image is ROM-less (Spec 801 §A). Commodore's ROMs are not ours
# to distribute, so they are mounted at runtime instead of baked in — which also means a
# CI job needs nothing but the source. That is the whole reason this workflow is five
# lines of substance.
#
# The `dockerbuild` label runs the job in a `docker:cli` container with the host's docker
# socket, so `docker build` here builds on the NAS daemon directly. The image lands in the
# NAS's local image store — the same one the wl-trx64 / wl2-trx64 containers run from.

name: build-image

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docker/Dockerfile'
      - '.gitea/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (defaults to the workspace version)'
        required: false

jobs:
  image:
    runs-on: dockerbuild
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the product version
        id: ver
        run: |
          # One version for the whole workspace (Spec 800 §E). The image tag must equal it,
          # so a running container can be identified by `ping` alone.
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "building wl-trx64:$V"

      - name: Build
        run: |
          docker build \
            -f docker/Dockerfile \
            --build-arg TRX64_VERSION=${{ steps.ver.outputs.version }} \
            -t wl-trx64:${{ steps.ver.outputs.version }} \
            -t wl-trx64:latest \
            .

      - name: Show what was built
        run: |
          docker images wl-trx64 --format '{{.Repository}}:{{.Tag}}  {{.Size}}  {{.CreatedSince}}'
          # Prove the binary in the image reports the version the tag claims. A tag that
          # disagrees with the build is the drift this pipeline exists to prevent — it
          # happened once already, when a hand-built "0.1.0" carried features 0.1.0 did not.
          docker run --rm --entrypoint /usr/local/bin/trx64-daemon \
            wl-trx64:${{ steps.ver.outputs.version }} --version
